<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PR Image Diff</title>
<style>
:root {
  --bg: #f4f5f6; --panel: #fff; --border: #e1e4e8; --text: #1f2328; --muted: #656d76;
  --accent: #0969da; --sel: #eaf2fd; --change: #e5197a; --checker: #e9ebee;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #0d1117; --panel: #161b22; --border: #30363d; --text: #e6edf3; --muted: #8d96a0;
    --accent: #4493f8; --sel: #1c2a3d; --change: #ff4fa3; --checker: #21262d;
  }
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body {
  display: grid; grid-template-rows: auto 1fr; background: var(--bg); color: var(--text);
  font: 13px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
}
button, select, input { font: inherit; color: inherit; }
header {
  display: flex; flex-wrap: wrap; gap: 10px; align-items: center; padding: 8px 12px;
  background: var(--panel); border-bottom: 1px solid var(--border);
}
header h1 { flex: 1; min-width: 200px; margin: 0; font-size: 14px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
header a { color: var(--accent); text-decoration: none; }
header label { color: var(--muted); display: inline-flex; gap: 6px; align-items: center; }
header input[type=number] { width: 56px; }
header select, header input, .btn { background: var(--panel); border: 1px solid var(--border); border-radius: 6px; padding: 3px 8px; }
.btn { cursor: pointer; }
.seg { display: inline-flex; border: 1px solid var(--border); border-radius: 6px; overflow: hidden; }
.seg button { border: 0; background: none; padding: 4px 10px; cursor: pointer; }
.seg button[aria-pressed=true] { background: var(--sel); color: var(--accent); }
.keys { color: var(--muted); font-size: 11px; }
main { display: grid; grid-template-columns: 280px 1fr 330px; min-height: 0; }
#files, #changes { overflow: auto; background: var(--panel); }
#files { border-right: 1px solid var(--border); }
#changes { border-left: 1px solid var(--border); padding: 10px; }
.file { display: flex; gap: 8px; align-items: center; padding: 7px 10px; border-bottom: 1px solid var(--border); cursor: pointer; }
.file[aria-current=true] { background: var(--sel); }
.file .name { flex: 1; min-width: 0; word-break: break-all; }
.file small { display: block; color: var(--muted); }
.badge { flex: none; padding: 0 7px; border-radius: 10px; font-size: 11px; background: var(--border); color: var(--muted); }
.badge.hot { background: var(--change); color: #fff; }
#viewer { overflow: auto; padding: 16px; }
.panes { display: flex; gap: 16px; align-items: flex-start; width: max-content; }
.pane-label { margin-bottom: 6px; color: var(--muted); font-size: 12px; }
.stage {
  position: relative; flex: none;
  background: repeating-conic-gradient(var(--checker) 0 25%, transparent 0 50%) 0 0 / 16px 16px;
  outline: 1px solid var(--border);
}
.stage.pixelated img, .stage.pixelated canvas { image-rendering: pixelated; }
.layer { position: absolute; top: 0; left: 0; height: auto; }
.faded { filter: grayscale(1); opacity: .3; }
.clip { position: absolute; inset: 0; }
.handle { position: absolute; top: 0; bottom: 0; width: 2px; margin-left: -1px; background: var(--accent); pointer-events: none; }
.slider { display: block; margin-top: 8px; }
.placeholder { display: grid; place-items: center; height: 100%; color: var(--muted); }
.box {
  position: absolute; min-width: 6px; min-height: 6px; outline: 2px solid var(--change); outline-offset: 2px;
  cursor: pointer;
}
.box span {
  position: absolute; top: -22px; left: -4px; padding: 0 5px; border-radius: 3px;
  background: var(--change); color: #fff; font-size: 11px; font-weight: 600; line-height: 16px;
}
.box.active { outline-width: 3px; animation: flash .6s 2; }
@keyframes flash { 50% { outline-color: transparent; } }
.summary { margin: 0 0 10px; color: var(--muted); }
.card { margin-bottom: 10px; padding: 10px; border: 1px solid var(--border); border-radius: 8px; cursor: pointer; }
.card.active { border-color: var(--change); }
.card-head { display: flex; gap: 8px; align-items: center; margin-bottom: 8px; }
.num { min-width: 22px; padding: 0 5px; border: 1px solid var(--border); border-radius: 4px; text-align: center; font-weight: 600; }
.card-head .btn { margin-left: auto; }
.crops { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
.crops.stacked { grid-template-columns: 1fr; }
.crops figure { margin: 0; }
.crops figcaption { color: var(--muted); font-size: 11px; }
.crops canvas { display: block; width: 100%; max-height: 180px; object-fit: contain; object-position: left top; image-rendering: pixelated; background: var(--checker); outline: 1px solid var(--border); }
@media (max-width: 900px) {
  main { grid-template-columns: 1fr; grid-template-rows: 30vh 1fr auto; }
  #files, #changes { border: 0; }
}
</style>
</head>
<body>
<header>
  <h1 id="title">Loading…</h1>
  <div class="seg" id="modes">
    <button data-mode="split">Split</button>
    <button data-mode="slider">Slider</button>
    <button data-mode="diff">Diff</button>
  </div>
  <label>Zoom
    <select id="zoom">
      <option value="fit">Fit</option><option value="1">100%</option><option value="2">200%</option>
      <option value="4">400%</option><option value="8">800%</option>
    </select>
  </label>
  <label title="pixelmatch threshold (0–1), smaller is more sensitive. 0.1 matches this repo's Playwright config">Threshold <input id="threshold" type="number" min="0" max="1" step="0.05" value="0.1"></label>
  <label title="Count pixels pixelmatch detects as anti-aliasing. Playwright ignores them"><input id="include-aa" type="checkbox"> Anti-aliasing</label>
  <span class="keys">j/k file · n/p change · 1/2/3 mode</span>
  <button class="btn" id="close">Close</button>
</header>
<main>
  <nav id="files"></nav>
  <section id="viewer"></section>
  <aside id="changes"></aside>
</main>
<script type="module">
import pixelmatch from 'https://cdn.jsdelivr.net/npm/pixelmatch@8.0.0/index.js';

const MODES = ['split', 'slider', 'diff'];
const GRID = 8;
const CROP_PAD = 24;
const state = { manifest: null, index: 0, mode: 'split', zoom: 'fit', threshold: 0.1, includeAA: false, slider: 50, current: null, active: -1, generation: 0 };
const $ = (selector) => document.querySelector(selector);

function h(tag, attrs = {}, ...children) {
  const el = document.createElement(tag);
  for (const [key, value] of Object.entries(attrs)) {
    if (key === 'style') Object.assign(el.style, value);
    else if (key.startsWith('on')) el.addEventListener(key.slice(2), value);
    else el.setAttribute(key, value);
  }
  el.append(...children.flat().filter((child) => child != null));
  return el;
}

const loadImage = (src) => new Promise((resolve, reject) => {
  const img = new Image();
  img.onload = () => resolve(img);
  img.onerror = () => reject(new Error(`Failed to load ${src}`));
  img.src = src;
});

function toCanvas(img, width, height) {
  const canvas = h('canvas', { width, height });
  canvas.getContext('2d').drawImage(img, 0, 0);
  return canvas;
}

const pixels = (canvas) => canvas.getContext('2d').getImageData(0, 0, canvas.width, canvas.height).data;

// Changed pixels are bucketed into GRID-sized cells; touching cells form one numbered region.
function findRegions(a, b, width, height) {
  const mask = new ImageData(width, height);
  const m = mask.data;
  const changed = pixelmatch(a, b, m, width, height, { threshold: state.threshold, includeAA: state.includeAA, diffMask: true, diffColor: [229, 25, 122] });
  const gw = Math.ceil(width / GRID);
  const gh = Math.ceil(height / GRID);
  const cells = new Int32Array(gw * gh * 4).fill(-1);
  for (let y = 0; y < height; y++) {
    for (let x = 0; x < width; x++) {
      if (m[(y * width + x) * 4 + 3] === 0) continue;
      const c = (((y / GRID) | 0) * gw + ((x / GRID) | 0)) * 4;
      if (cells[c] < 0) {
        cells[c] = cells[c + 2] = x;
        cells[c + 1] = cells[c + 3] = y;
      } else {
        cells[c] = Math.min(cells[c], x); cells[c + 2] = Math.max(cells[c + 2], x);
        cells[c + 3] = y;
      }
    }
  }
  const seen = new Uint8Array(gw * gh);
  const regions = [];
  for (let start = 0; start < gw * gh; start++) {
    if (seen[start] || cells[start * 4] < 0) continue;
    const region = { x0: Infinity, y0: Infinity, x1: -1, y1: -1 };
    const stack = [start];
    seen[start] = 1;
    while (stack.length) {
      const cell = stack.pop();
      const c = cell * 4;
      region.x0 = Math.min(region.x0, cells[c]); region.y0 = Math.min(region.y0, cells[c + 1]);
      region.x1 = Math.max(region.x1, cells[c + 2]); region.y1 = Math.max(region.y1, cells[c + 3]);
      const cx = cell % gw;
      const cy = (cell / gw) | 0;
      for (let dy = -1; dy <= 1; dy++) {
        for (let dx = -1; dx <= 1; dx++) {
          const nx = cx + dx;
          const ny = cy + dy;
          const next = ny * gw + nx;
          if (nx < 0 || ny < 0 || nx >= gw || ny >= gh || seen[next] || cells[next * 4] < 0) continue;
          seen[next] = 1;
          stack.push(next);
        }
      }
    }
    regions.push({ x: region.x0, y: region.y0, w: region.x1 - region.x0 + 1, h: region.y1 - region.y0 + 1 });
  }
  regions.sort((r, s) => r.y - s.y || r.x - s.x).forEach((r, i) => { r.n = i + 1; });
  const maskCanvas = h('canvas', { width, height });
  maskCanvas.getContext('2d').putImageData(mask, 0, 0);
  return { regions, changed, mask: maskCanvas };
}

async function analyze(file) {
  const [base, head] = await Promise.all([
    file.hasBase ? loadImage(`img/${file.id}/base`) : null,
    file.hasHead ? loadImage(`img/${file.id}/head`) : null,
  ]);
  const width = Math.max(base?.naturalWidth ?? 0, head?.naturalWidth ?? 0);
  const height = Math.max(base?.naturalHeight ?? 0, head?.naturalHeight ?? 0);
  const result = { base, head, width, height, regions: [], changed: 0 };
  if (!base || !head) return result;
  result.baseCanvas = toCanvas(base, width, height);
  result.headCanvas = toCanvas(head, width, height);
  return Object.assign(result, findRegions(pixels(result.baseCanvas), pixels(result.headCanvas), width, height));
}

function badgeText(file) {
  if (file.status === 'added') return 'new';
  if (file.status === 'removed') return 'deleted';
  return file.count ?? '…';
}

function renderFiles() {
  $('#files').replaceChildren(...state.manifest.files.map((file, i) => {
    const parts = file.path.split('/');
    return h('div', { class: 'file', 'aria-current': String(i === state.index), onclick: () => select(i) },
      h('div', { class: 'name' }, parts.pop(), h('small', {}, parts.join('/'))),
      h('span', { class: `badge${file.count > 0 || !file.hasBase || !file.hasHead ? ' hot' : ''}` }, String(badgeText(file))));
  }));
  $('#files [aria-current=true]')?.scrollIntoView({ block: 'nearest' });
}

function scaleFor(an) {
  if (state.zoom !== 'fit') return Number(state.zoom);
  const columns = state.mode === 'split' ? 2 : 1;
  const available = $('#viewer').clientWidth - 32 - (columns - 1) * 16;
  return Math.min(1, available / columns / an.width);
}

function layer(img, an, className = 'layer') {
  const el = img.cloneNode();
  el.className = className;
  el.style.width = `${(img.naturalWidth / an.width) * 100}%`;
  return el;
}

function box(region, an, side) {
  const pct = (value, total) => `${(value / total) * 100}%`;
  return h('div', {
    class: `box${region.n - 1 === state.active ? ' active' : ''}`,
    'data-n': region.n,
    'data-side': side,
    style: { left: pct(region.x, an.width), top: pct(region.y, an.height), width: pct(region.w, an.width), height: pct(region.h, an.height) },
    onclick: () => focusRegion(region.n - 1),
  }, h('span', {}, String(region.n)));
}

function stage(an, scale, side, ...layers) {
  const el = h('div', { class: `stage${scale > 1 ? ' pixelated' : ''}`, style: { width: `${an.width * scale}px`, height: `${an.height * scale}px` } }, layers);
  if (side) el.append(...an.regions.map((region) => box(region, an, side)));
  return el;
}

function renderViewer() {
  const an = state.current;
  const viewer = $('#viewer');
  if (!an) return viewer.replaceChildren();
  const scale = scaleFor(an);
  const only = an.head ?? an.base;
  if (!an.base || !an.head) {
    viewer.replaceChildren(h('div', { class: 'pane-label' }, an.head ? 'Added in this PR' : 'Deleted in this PR'), stage(an, scale, null, layer(only, an)));
  } else if (state.mode === 'split') {
    viewer.replaceChildren(h('div', { class: 'panes' },
      h('div', {}, h('div', { class: 'pane-label' }, `Before · ${state.manifest.base.slice(0, 7)}`), stage(an, scale, 'base', layer(an.base, an))),
      h('div', {}, h('div', { class: 'pane-label' }, `After · ${state.manifest.head.slice(0, 7)}`), stage(an, scale, 'head', layer(an.head, an)))));
  } else if (state.mode === 'slider') {
    const clip = h('div', { class: 'clip', style: { clipPath: `inset(0 0 0 ${state.slider}%)` } }, layer(an.head, an));
    const handle = h('div', { class: 'handle', style: { left: `${state.slider}%` } });
    const input = h('input', { class: 'slider', type: 'range', min: 0, max: 100, step: 0.1, value: state.slider, style: { width: `${an.width * scale}px` } });
    input.addEventListener('input', () => {
      state.slider = Number(input.value);
      clip.style.clipPath = `inset(0 0 0 ${state.slider}%)`;
      handle.style.left = `${state.slider}%`;
    });
    viewer.replaceChildren(h('div', { class: 'pane-label' }, 'Before ◀ ▶ After'), stage(an, scale, 'head', layer(an.base, an), clip, handle), input);
  } else {
    an.mask.className = 'layer';
    an.mask.style.width = '100%';
    viewer.replaceChildren(h('div', { class: 'pane-label' }, `${an.changed.toLocaleString()} changed pixels, over the faded “after” image`),
      stage(an, scale, 'head', layer(an.head, an, 'layer faded'), an.mask));
  }
}

function crop(source, region, label) {
  const x = Math.max(0, region.x - CROP_PAD);
  const y = Math.max(0, region.y - CROP_PAD);
  const width = Math.min(source.width, region.x + region.w + CROP_PAD) - x;
  const height = Math.min(source.height, region.y + region.h + CROP_PAD) - y;
  const canvas = h('canvas', { width, height });
  canvas.getContext('2d').drawImage(source, x, y, width, height, 0, 0, width, height);
  return h('figure', {}, canvas, h('figcaption', {}, label));
}

function renderChanges() {
  const an = state.current;
  const list = $('#changes');
  if (!an) return list.replaceChildren();
  if (!an.base || !an.head) return list.replaceChildren(h('p', { class: 'summary' }, `${an.width}×${an.height}px, nothing to compare against.`));
  const summary = an.regions.length
    ? `${an.regions.length} change${an.regions.length > 1 ? 's' : ''} · ${an.changed.toLocaleString()} pixels`
    : 'No pixel differences (the file changed, the pixels did not).';
  list.replaceChildren(h('p', { class: 'summary' }, summary), ...an.regions.map((region, i) => h('div', {
    class: `card${i === state.active ? ' active' : ''}`,
    'data-n': region.n,
    onclick: () => focusRegion(i),
  },
  h('div', { class: 'card-head' }, h('span', { class: 'num' }, String(region.n)), `${region.w}×${region.h}px`, h('button', { class: 'btn' }, 'Focus')),
  h('div', { class: `crops${region.w > region.h * 3 ? ' stacked' : ''}` }, crop(an.baseCanvas, region, 'Before'), crop(an.headCanvas, region, 'After')))));
}

function focusRegion(i) {
  const an = state.current;
  const region = an?.regions[i];
  if (!region) return;
  state.active = i;
  const viewer = $('#viewer');
  const fits = Math.min((viewer.clientWidth * 0.4) / region.w, (viewer.clientHeight * 0.4) / region.h);
  const target = [8, 4, 2, 1].find((z) => z <= fits) ?? 1;
  if (target > scaleFor(an)) {
    state.zoom = String(target);
    $('#zoom').value = state.zoom;
  }
  renderViewer();
  renderChanges();
  const el = $(`.box[data-n="${region.n}"][data-side="head"]`) ?? $(`.box[data-n="${region.n}"]`);
  el?.scrollIntoView({ block: 'center', inline: 'center' });
  $(`.card[data-n="${region.n}"]`)?.scrollIntoView({ block: 'nearest' });
}

async function select(i) {
  state.index = i;
  state.active = -1;
  state.zoom = 'fit';
  $('#zoom').value = 'fit';
  renderFiles();
  const file = state.manifest.files[i];
  const generation = state.generation;
  const an = await analyze(file);
  if (generation !== state.generation || i !== state.index) return;
  file.count = an.regions.length;
  state.current = an;
  $('#viewer').scrollTo(0, 0);
  renderFiles();
  renderViewer();
  renderChanges();
}

// Counts regions for every file in the background so the sidebar shows where changes are.
async function countAll() {
  const generation = ++state.generation;
  state.manifest.files.forEach((file) => { file.count = undefined; });
  renderFiles();
  for (const file of state.manifest.files) {
    if (!file.hasBase || !file.hasHead) continue;
    const an = await analyze(file);
    if (generation !== state.generation) return;
    file.count = an.regions.length;
    renderFiles();
  }
}

function setMode(mode) {
  state.mode = mode;
  document.querySelectorAll('#modes button').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.mode === mode)));
  if (state.active >= 0) focusRegion(state.active);
  else renderViewer();
}

document.querySelectorAll('#modes button').forEach((b) => b.addEventListener('click', () => setMode(b.dataset.mode)));
$('#zoom').addEventListener('change', (e) => { state.zoom = e.target.value; renderViewer(); });
function recompute() {
  countAll();
  select(state.index);
}
$('#threshold').addEventListener('change', (e) => {
  state.threshold = Math.max(0, Math.min(1, Number(e.target.value) || 0));
  recompute();
});
$('#include-aa').addEventListener('change', (e) => {
  state.includeAA = e.target.checked;
  recompute();
});
$('#close').addEventListener('click', async () => {
  await fetch('close', { method: 'POST' }).catch(() => {});
  document.body.replaceChildren(h('p', { style: { padding: '24px' } }, 'Server stopped. You can close this tab.'));
});
window.addEventListener('resize', () => state.zoom === 'fit' && renderViewer());
document.addEventListener('keydown', (e) => {
  if (e.target.matches('input, select') || e.metaKey || e.ctrlKey || e.altKey) return;
  const files = state.manifest?.files ?? [];
  const regions = state.current?.regions ?? [];
  if (e.key === 'j' && state.index < files.length - 1) select(state.index + 1);
  else if (e.key === 'k' && state.index > 0) select(state.index - 1);
  else if (e.key === 'n' && regions.length) focusRegion((state.active + 1) % regions.length);
  else if (e.key === 'p' && regions.length) focusRegion((state.active - 1 + regions.length) % regions.length);
  else if (MODES[Number(e.key) - 1]) setMode(MODES[Number(e.key) - 1]);
});

(async () => {
  state.manifest = await (await fetch('manifest.json')).json();
  const { title, url, number } = state.manifest;
  document.title = `#${number} image diff`;
  $('#title').replaceChildren(h('a', { href: url, target: '_blank' }, `#${number}`), ` ${title}`);
  setMode('split');
  await select(0);
  countAll();
})();
</script>
</body>
</html>
